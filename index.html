<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>High Divide Loop</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="High Divide"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#2f6b4f">
<link rel="stylesheet" href="/src/style.css">
</head><body>
<div id="map"></div><div id="toast"></div>
<button class="fab" id="loc" style="top:calc(10px + env(safe-area-inset-top,0))" title="My location">◎</button>
<button class="fab" id="wtr" style="top:calc(60px + env(safe-area-inset-top,0))" title="Water spots">💧</button>
<button class="fab" id="lns" style="top:calc(110px + env(safe-area-inset-top,0))" title="Show or hide trip lines">〰</button>
<button class="fab" id="lay" style="right:10px;bottom:calc(var(--sh,45%) + 30px)" title="Map style"></button>
<div class="chip" id="laymenu" style="display:none;position:absolute;right:58px;bottom:calc(var(--sh,45%) + 30px);z-index:950;padding:2px"><button class="opt" data-b="topo" aria-checked="true">Topo</button><button class="opt" data-b="sat" aria-checked="false">Satellite <small>(online only)</small></button></div>
<div id="hud"><div class="hrow"><button class="chip" id="cmp" title="Compass (true north). Tap to enable."><span style="font-size:10px;line-height:8px;color:var(--hi)">▼</span><svg id="dial" viewBox="0 0 48 48"><circle cx="24" cy="24" r="22" fill="none" stroke="var(--line)" stroke-width="2"/><polygon points="24,5 29,24 19,24" fill="#d32f2f"/><polygon points="24,43 29,24 19,24" fill="var(--mut)"/><text x="24" y="17" text-anchor="middle" font-size="8" font-weight="700" fill="#fff">N</text></svg><b id="hd">–°</b></button><div class="chip" id="elv">⛰ <small>waiting for GPS</small></div></div></div>
<div class="chip" id="tstb" style="display:none;position:absolute;left:10px;bottom:calc(var(--sh,45%) + 86px);z-index:955;align-items:center;gap:8px;font-size:.75rem;padding:4px 6px 4px 9px;max-width:min(260px,80vw)"><span>Practice mode: tap the map to place yourself</span><button class="btn" id="tstx" style="flex:none;width:auto;padding:3px 9px;font-size:.75rem">Exit</button></div>
<div class="chip" id="prg" style="display:none;position:absolute;left:10px;bottom:calc(var(--sh,45%) + 12px);z-index:900;max-width:min(190px,62vw);font-size:.72rem;line-height:1.35;padding:4px 7px"></div>
<div id="sheet"><div id="grab" role="separator" aria-label="Drag to resize the panel"><span></span></div><div id="tabs"></div><div id="body"><p style="padding:6px 14px"><b>Starting app…</b><br><small>If this message stays, the app did not finish starting.</small></p></div></div>
<script>if(navigator.serviceWorker){var rs0=/[?&]reset/.test(location.search),dir=location.href.replace(/[^\/]*(\?.*)?$/,"");navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){var w=r.active||r.waiting||r.installing,u=w?w.scriptURL:"";if(r.scope.indexOf(dir)==0&&(rs0||u!=dir+"sw.js"))r.unregister()})});if(rs0){caches.keys().then(function(k){k.forEach(function(n){if(n.indexOf("hdl-")==0)caches.delete(n)})});try{["sd","pace","sheetH","base","elev5","waterOSM6","wxc"].forEach(function(k){localStorage.removeItem(k)})}catch(e){}}}</script><script>addEventListener("error",function(e){var b=document.getElementById("body");if(b)b.innerHTML="<p><b>Something went wrong.</b></p><p><small>"+e.message+" ("+String(e.filename||"").split("/").pop()+":"+e.lineno+")</small></p>"})</script><script>document.addEventListener("DOMContentLoaded",function(){alert("Hello Richard ❤️")})</script><script type="module" src="/src/main.js"></script>
</body></html>
